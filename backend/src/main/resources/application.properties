spring.application.name=backend
server.port=8080
spring.output.ansi.enabled=always

# Oracle DB
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XE
spring.datasource.username=factoryview
spring.datasource.password=2449
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA
# database/oracle/01_create_app_users.sql, 02_create_board.sql, 03_create_report_board.sql을 순서대로 실행한 뒤 애플리케이션을 실행합니다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Session authentication
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# HTTPS 배포 환경에서는 true로 변경하세요.
server.servlet.session.cookie.secure=false
